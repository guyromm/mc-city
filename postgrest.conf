# PostgREST for minecraft.webgma.co.il (/rest/ and api.minecraft.webgma.co.il -> 127.0.0.1:$API_PORT).
# No secrets here: db-uri, jwt-secret and db-anon-role come from PGRST_DB_URI / PGRST_JWT_SECRET / PGRST_DB_ANON_ROLE
# in ~/.env, which the `api` worker sources inside its loop.
db-schemas = "api"
db-pool = 10
server-host = "127.0.0.1"
server-port = "$(API_PORT)"
db-max-rows = 5000
openapi-mode = "disabled"
db-channel-enabled = true
# auth.webgma.co.il SSO (#275/13): tokens for another system are refused (401 JWTNotInAudience); our own tokens carry
# no aud and still pass. jwt-secret = @~/.pgrst-jwks.json (own HS256 + auth's RS256), built by scripts/pgrst-jwks.py.
jwt-aud = "minecraft"
