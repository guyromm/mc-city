# PostgREST for minecraft.webgma.co.il (/rest/ and api.minecraft.webgma.co.il -> 127.0.0.1:$API_PORT).
# No secrets here: db-uri and db-anon-role come from PGRST_DB_URI / PGRST_DB_ANON_ROLE; jwt-secret = PGRST_JWT_SECRET=@~/.pgrst-jwks.json
# in ~/.env, which the `api` worker sources inside its loop.
db-schemas = "api"
db-pool = 10
server-host = "127.0.0.1"
server-port = "$(API_PORT)"
db-max-rows = 5000
openapi-mode = "disabled"
db-channel-enabled = true
# auth.webgma.co.il SSO (#275/13): the only issuer. jwt-secret = @~/.pgrst-jwks.json (auth's public RS256 keys, set by the
# api worker from scripts/pgrst-jwks.py); tokens for another system are refused (401 JWTNotInAudience).
jwt-aud = "minecraft"
