# minecraft.webgma.co.il -- mc-city Bedrock server + city builder UI (#288), created 2026-11-15 by resource-manager.
# minecraft (+www): / -> UI (UI_PORT 3794; /claude is a route of that app), /rest/ -> PostgREST (API_PORT 3795, prefix stripped).
# api.minecraft: / -> PostgREST (3795). Ports match /home/minecraft/.env. Placeholder until the app listens.
# TLS: certbot --webroot -w /var/www/letsencrypt (cert-name minecraft.webgma.co.il, all three names).
server {
    listen      80;
    listen      [::]:80;
    server_name minecraft.webgma.co.il www.minecraft.webgma.co.il api.minecraft.webgma.co.il;
    access_log /var/log/nginx/minecraft/access.log;   # own log, readable only by minecraft (#3541)
    access_log /var/log/nginx/access.log;             # keep the host-wide log
    include snippets/acme-webroot.conf;
    location / { return 301 https://$host$request_uri; }
}

map $http_upgrade $minecraft_connection_upgrade { default upgrade; '' close; }

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name minecraft.webgma.co.il www.minecraft.webgma.co.il;
    access_log /var/log/nginx/minecraft/access.log;   # own log, readable only by minecraft (#3541)
    access_log /var/log/nginx/access.log;             # keep the host-wide log
    ssl_certificate     /etc/letsencrypt/live/minecraft.webgma.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minecraft.webgma.co.il/privkey.pem;

    # #222 R5 (doc:vite-hardening v2); the app dir is the home (repo = ~), so allow only its source dirs + claude-ui/web
    include snippets/vite-guard.conf;
    location ~ ^/@fs/(?!home/minecraft/(src|web|node_modules|\.svelte-kit|claude-ui/web)/) { return 403; }

    location /rest/ {
        proxy_pass http://127.0.0.1:3795/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        error_page 502 504 = @api_placeholder;
    }
    location / {
        proxy_pass http://127.0.0.1:3794;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $minecraft_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 8m;
        error_page 502 504 = @placeholder;
    }
    location @placeholder { root /var/www/minecraft-placeholder; try_files /index.html =503; }
    location @api_placeholder { default_type text/plain; return 503 "minecraft API: coming soon\n"; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name api.minecraft.webgma.co.il;
    access_log /var/log/nginx/minecraft/access.log;   # own log, readable only by minecraft (#3541)
    access_log /var/log/nginx/access.log;             # keep the host-wide log
    ssl_certificate     /etc/letsencrypt/live/minecraft.webgma.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minecraft.webgma.co.il/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:3795;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        error_page 502 504 = @api_placeholder;
    }
    location @api_placeholder { default_type text/plain; return 503 "minecraft API: coming soon\n"; }
}
